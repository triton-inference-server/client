[project]
name = "tritonclient"
dynamic = ["version", "dependencies", "optional-dependencies"]
authors = [{ name = "NVIDIA Inc.", email = "sw-dl-triton@nvidia.com" }]
description = "Python client library and utilities for communicating with Triton Inference Server"
readme = { content-type = "text/markdown", text = """See [download-using-python-package-installer-pip](https://github.com/triton-inference-server/client/tree/main#download-using-python-package-installer-pip) for package details.

The [client examples](https://github.com/triton-inference-server/client/tree/main/src/python/examples) demonstrate how to use the package to issue request to [triton inference server](https://github.com/triton-inference-server/server).""" }
# PEP 639 SPDX expression, emitted as License-Expression at
# Metadata-Version 2.4. The matching "License ::" trove classifier must stay
# removed: declaring both is rejected outright by the build backend.
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
requires-python = ">=3.9"
keywords = [
    "grpc",
    "http",
    "triton",
    "tensorrt",
    "inference",
    "server",
    "service",
    "client",
    "nvidia",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://developer.nvidia.com/nvidia-triton-inference-server"

[tool.hatch.metadata.hooks.custom]
# Resolves version from $VERSION and dependencies from requirements/ --
# see hatch_build.py.
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["tritonclient"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
